<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CRABORA</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- The control strip is NOT part of the chat. STOP has to work when
     the model is slow, confused or unreachable, so it posts straight to
     /api/stop and never goes near the agent. -->
<header class="strip">
  <div class="brand">
    <span class="mark" aria-hidden="true"></span>
    <span>CRABORA</span>
    <span class="phase" id="phase">read-only</span>
  </div>

  <div class="lights" id="lights">
    <span class="light" id="light-bus"   title="servo bus">bus</span>
    <span class="light" id="light-servos" title="servos answering">servos</span>
    <span class="light" id="light-faults" title="latched faults">faults</span>
    <span class="light" id="light-agent" title="language model">agent</span>
  </div>

  <div class="actions">
    <button class="btn" data-tool="robot_status">Status</button>
    <button class="btn" data-tool="calibration_check">Calibration</button>
    <button class="btn" data-tool="foot_positions">Feet</button>
    <button class="btn" data-tool="imu_state">IMU</button>

    <!-- Motion. Disabled until a human arms it; the server enforces the
         same rule, so this is a courtesy, not the gate. -->
    <span class="sep" aria-hidden="true"></span>
    <button class="btn arm" id="arm" title="Allow motion for a few minutes">ARM</button>
    <button class="btn move" data-motion="stand_up" disabled>Stand Up</button>
    <button class="btn move" data-motion="lay_down" disabled>Lay Down</button>
    <button class="btn move" data-motion="walk" disabled
            title="200 mm forward">Walk</button>
    <button class="btn stop" id="stop">STOP</button>

    <!-- Voice. Speech recognition needs a SECURE CONTEXT: https, or
         localhost. Served over plain http from the Pi's LAN address it
         is blocked by the browser, so the button says why. -->
    <span class="sep" aria-hidden="true"></span>
    <button class="btn mic" id="mic" title="Hold a conversation">
      <span class="dot" aria-hidden="true"></span><span id="mic-label">Talk</span>
    </button>
    <button class="btn voice" id="speak" title="Read replies aloud"
            aria-pressed="false">Voice off</button>
  </div>
</header>

<main>
  <div class="log" id="log" aria-live="polite">
    <div class="msg bot">
      <div class="who">crabora</div>
      <div class="body">
        <p>I can look at the robot, and move it once you press
           <strong>ARM</strong>. Arming lasts a few minutes and I can’t
           do it myself.</p>
        <p>Ask me things like <em>“is anything faulted?”</em>,
           <em>“nudge leg 3’s femur up 10 degrees”</em> or
           <em>“lay down, then stand back up at 90mm”</em></p>
      </div>
    </div>
  </div>

  <form class="composer" id="composer" autocomplete="off">
    <input id="prompt" type="text" placeholder="Ask about the robot…"
           aria-label="Message">
    <button type="submit" id="send">Send</button>
  </form>
</main>

<script src="app.js"></script>
</body>
</html>
